<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOCWT - Contact</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <nav class="navbar" id="non-transparent-navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-logo"><img src="../resources/logo.svg" alt="BIOCWT logo"
                    id="BIOCWT-logo"></a>
            <button class="navbar-toggle" aria-label="Open navigation menu" aria-expanded="false">
                <img src="../resources/navbar-icon.svg" alt="">
            </button>
            <ul class="navbar-menu">
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="prices-for-services.html">Prices for services</a></li>
                <li><a href="about-us.html">About us</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="full-container" id="non-landing-page">
        <!---------- Contact Section --------->
        <div class="contact-container">
            <div class="contact-content-container">
                <div class="contact-left">
                    <h1>CONTACT</h1>
                    <div class="contact-content">
                        <div class="contact-info" id="phone-call-info">
                            <img src="../resources/phone-call-icon.svg" alt="phone-call-icon" class="footer-icon">
                            <p>+420 000 000 000</p>
                        </div>
                        <div class="contact-info">
                            <img src="../resources/geo-alt-icon.svg" alt="geo-alt-icon" class="footer-icon">
                            <p>Na Plzeňce 1166/0<br>
                                150 00</p>
                        </div>
                    </div>
                </div>
                <div class="contact-right">
                    <div class="location-map">
                        <img src="../resources/map.jpg" alt="map">
                    </div>
                </div>
            </div>
        </div>

        <div class="questions-container" id="contact-questions-for-mobile">
            <h1>ANY QUESTIONS?</h1>
            <div class="questions-content">
                <div class="fields">
                    <form>
                        <label for="full-name"></label>
                        <input type="text" name="full-name" id="full-name" placeholder="Your name">
                        <label for="phone-number"></label>
                        <input type="tel" name="phone-number" id="phone-number" placeholder="Your telephone number">
                        <label for="question"></label>
                        <textarea name="question" id="question" placeholder="Your question" rows="3"></textarea>
                        <input type="submit" value="Send" id="send-button">
                    </form>
                </div>
                <div class="questions-text">
                    <p>Write to us and we will be sure to<br class="questions-br">
                        answer all your questions and give<br class="questions-br">
                        you a comprehensive consultation.</p>
                </div>
            </div>
            <img src="resources/wood-log.svg" alt="wood-log">
        </div>


        <!-- Footer -->
        <footer>
            <div class="first-line">
                <a href="../index.html" class="navbar-logo"><img src="../resources/logo.svg" alt="BIOCWT logo"
                        id="BIOCWT-logo"></a>
                <div class="contact-info" id="phone-call-info">
                    <img src="../resources/phone-call-icon.svg" alt="phone-call-icon" class="footer-icon">
                    <p>+420 000 000 000</p>
                </div>
                <div class="contact-info">
                    <img src="../resources/geo-alt-icon.svg" alt="geo-alt-icon" class="footer-icon">
                    <p>Na Plzeňce 1166/0<br>
                        150 00</p>
                </div>
            </div>
            <div class="second-line">
                <a href="../pages/404.html">Privacy Policy</a>
            </div>
        </footer>
</body>
<script src="../script.js"></script>

</html>
